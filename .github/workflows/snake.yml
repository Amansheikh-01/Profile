name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#22D3EE&color_dots=#2d3343,#7C3AED,#A78BFA,#10B981,#34D399
            dist/github-snake-dark.svg?color_snake=#22D3EE&color_dots=#2d3343,#7C3AED,#A78BFA,#10B981,#34D399
            dist/github-snake-light.svg?color_snake=#0891B2&color_dots=#E2E8F0,#C084FC,#7C3AED,#059669,#10B981

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
